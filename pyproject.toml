[project]
name = "ouroboros"
version = "0.1.0"
description = "A toolkit for investigating cell cycling dynamics in scRNA-seq"
readme = "README.md"
requires-python = ">=3.6,<3.7"
license = {text = "MIT"}
authors = [
  {name = "Haley MacDonald", email = "hmacdonald@bcgsc.ca"}
]
dependencies = [
  "numpy>=1.16.4",
  "scipy>=1.3.0",
  "pandas>=0.21.0",
  "anndata==0.7.5",
  "matplotlib>=3.1.0",
  "seaborn>=0.11.2",
  "tensorflow==1.14",
  "tensorflow-probability==0.7.0",
  "cartopy",
  "kneed"
]

[project.optional-dependencies]
extra = [
  "git+https://github.com/klarman-cell-observatory/scPhere.git"
]


[project.urls]
Homepage = "https://github.com/haleymac/Ouroboros"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
ouroboros = "ouroboros.main:main"

[tool.setuptools.package-data]
"ouroboros" = ["data/*", "data/model/*"]



