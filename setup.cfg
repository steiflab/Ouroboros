[metadata]
name = ouroboros
version = 0.1.0
description = A toolkit for investigating cell cycling dynamics in scRNA-seq
author = Haley MacDonald
author_email = hmacdonald@bcgsc.ca
license = MIT

[options]
packages = find:
include_package_data = True
python_requires = >=3.6,<3.7
install_requires =
    numpy>=1.16.4
    scipy>=1.3.0
    pandas>=0.21.0
    anndata==0.7.5
    matplotlib>=3.1.0
    seaborn>=0.11.2
    tensorflow==1.14
    tensorflow-probability==0.7.0
    plotly>=5.18.0
    scikit-learn>=0.24.2
    cartopy
    importlib_resources
    nbformat 
    kaleido

[options.entry_points]
console_scripts =
    ouroboros = ouroboros.main:main

[options.package_data]
ouroboros = data/*, data/model/*
