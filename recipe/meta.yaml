{% set name = "ouroboros" %}
{% set version = "1.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/o/ouroboros/ouroboros-{{ version }}.tar.gz
  sha256: 8bcc260e62f4c3c4664218472abfee765186d2053cadf000c20d43803b97665a

requirements:
  host:
    - python {{ python }}
    - pip <25
    - setuptools >=42
    - wheel
  run:
    - python >=3.9,<3.11
    - numpy >=1.22,<1.24
    - scipy >=1.7,<1.10
    - pandas >=1.3,<2.0
    - anndata >=0.7.5,<0.9
    - matplotlib >=3.1,<3.8
    - seaborn >=0.11.2,<0.13
    - tensorflow-cpu >=2.8,<2.12
    - tensorflow-probability >=0.18,<0.19
    - plotly >=5.18.0
    - scikit-learn >=0.24.2,<1.3
    - python-kaleido <1.0.0
    - importlib-resources
    - nbformat
    - kneed

test:
  imports:
    - ouroboros
  commands:
    - ouroboros --help

about:
  home: https://github.com/steiflab/Ouroboros
  license: MIT
  summary: "A toolkit for investigating cell cycling dynamics in scRNA-seq"
  license_file: LICENSE

extra:
  recipe-maintainers:
    - haleymac
    - glenn032787
