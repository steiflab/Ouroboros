{% set name = "ouroboros" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/o/ouroboros/ouroboros-{{ version }}.tar.gz
  sha256: <fill_this_after_release>

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.9,<=3.12
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=3.9,<=3.12
    - numpy >=1.24.4
    - scipy >=1.3.0
    - pandas >=0.21.0
    - anndata >=0.7.5
    - matplotlib >=3.1.0
    - seaborn >=0.11.2
    - tensorflow ==2.10.0
    - tensorflow-probability ==0.17.0
    - plotly >=5.18.0
    - scikit-learn >=0.24.2
    - kaleido <1.0.0
    - importlib-resources
    - nbformat
    - kneed

test:
  imports:
    - ouroboros
  commands:
    - ouroboros --help

about:
  home: https://github.com/haleymac/Ouroboros
  license: MIT
  summary: "A toolkit for investigating cell cycling dynamics in scRNA-seq"
  license_file: LICENSE

extra:
  recipe-maintainers:
    - haleymac
