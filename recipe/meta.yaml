{% set name = "sc-ouroboros" %}
{% set version = "1.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/04/12/4ed4aa73b00651665a73b50b672687efc724a641f2bc948ce678fca4d077/sc_ouroboros-1.0.2.tar.gz
  sha256: 14e16152ba0934507845e49422cb925e52b3c0a53b12167a6318bb9983aba5a0

requirements:
  host:
    - python {{ python }}
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=3.9,<3.13
    - numpy >=1.24.4,<2
    - scipy >=1.3.0
    - pandas >=0.21.0
    - anndata >=0.7.5
    - matplotlib >=3.1.0
    - seaborn >=0.11.2
    - tensorflow-cpu >=2.0
    - tensorflow-probability>=0.19
    - tf-keras 
    - plotly >=5.18.0
    - scikit-learn >=0.24.2
    - python-kaleido <1.0.0
    - importlib-resources
    - nbformat
    - kneed

test:
  imports:
    - ouroboros
  commands:
    - ouroboros --help

about:
  home: https://github.com/haleymac/Ouroboros
  license: MIT
  summary: "A toolkit for investigating cell cycling dynamics in scRNA-seq"
  license_file: LICENSE

extra:
  recipe-maintainers:
    - haleymac
